<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - BatPay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-bg">

    <div class="auth-card row g-0">
        <!-- Sidebar Image / Info -->
        <div class="col-md-5 auth-sidebar d-none d-md-flex">
            <a href="index.html" class="text-decoration-none mb-auto">
                <span class="fs-2 bat-logo-text"><span class="text-white">BAT</span><span class="pay">PAY</span></span>
            </a>
            <div>
                <h3 class="fw-bold mb-3">Bem-vindo de volta!</h3>
                <p class="text-white-50 lead fs-6">Acesse seu painel para gerenciar seus pagamentos, cobranças e clientes de forma rápida e segura.</p>
            </div>
            <div class="mt-auto">
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-shield-check fs-2 text-warning"></i>
                    <small class="text-white-50">Ambiente 100% seguro e criptografado.</small>
                </div>
            </div>
        </div>
        
        <!-- Form -->
        <div class="col-md-7 p-4 p-md-5 bg-white d-flex flex-column justify-content-center">
            <div class="d-md-none mb-4 text-center">
                <a href="index.html" class="text-decoration-none">
                    <span class="fs-2 bat-logo-text"><span class="bat">BAT</span><span class="pay">PAY</span></span>
                </a>
            </div>
            
            <div class="mb-4">
                <h2 class="fw-bold brand-text-dark">Entrar</h2>
                <p class="text-secondary">Insira seus dados para acessar sua conta.</p>
            </div>

            <form action="dashboard.html" method="GET">
                <div class="mb-3">
                    <label class="form-label fw-medium text-dark">E-mail</label>
                    <input type="email" class="form-control form-control-lg bg-light border-0" placeholder="seu@email.com" required>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-medium text-dark mb-0">Senha</label>
                        <a href="#" class="text-decoration-none text-primary fw-medium text-sm">Esqueci minha senha</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" required>
                        <button class="btn btn-light bg-light border-0 text-secondary" type="button"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label text-secondary" for="remember">Lembrar meu acesso</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-4">Entrar na Plataforma</button>
                
                <div class="text-center">
                    <p class="text-secondary mb-0">Ainda não tem uma conta? <a href="cadastro.html" class="text-primary fw-bold text-decoration-none">Criar conta</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
